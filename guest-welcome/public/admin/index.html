<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>.and — Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content=".and Admin">
<meta name="theme-color" content="#faf8f4">
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest/admin.webmanifest">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="icon" href="/assets/icon-192.png">
<link rel="stylesheet" href="/css/base.css">
<style>
  .shell { max-width: 960px; }
  .tabs { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: 20px; border-bottom: 1px solid var(--line); padding-bottom: 14px; }
  .tab { min-height: 48px; padding: 0 1.3rem; border-radius: 999px; border: 1px solid transparent; background: transparent; cursor: pointer; font-size: 1rem; }
  .tab.on { background: var(--ink); color: #fff; }
  .banner { background: var(--accent-wash); border: 1px solid var(--accent-soft); border-radius: 14px; padding: 12px 16px; margin-bottom: 18px; font-size: .95rem; }
  .list > * + * { margin-top: 10px; }
  .li { display: flex; align-items: center; gap: 1rem; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; }
  .li .grow { flex: 1; min-width: 0; }
  .li .nm { font-weight: 400; font-size: 1.05rem; }
  .li .meta { color: var(--muted); font-size: .88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .li.out { opacity: .6; }
  .li img.th { width: 84px; height: 56px; object-fit: cover; border-radius: 8px; background: #ddd; }
  .li .acts { display: flex; gap: .4rem; flex-wrap: wrap; justify-content: flex-end; }
  .editor { margin-bottom: 22px; border-color: var(--accent); }
  .editor h3 { font: italic 300 1.9rem var(--serif); margin-bottom: 1rem; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem; }
  @media (max-width: 640px) { .cols { grid-template-columns: 1fr; } .li { flex-wrap: wrap; } }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 14px; flex-wrap: wrap; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 22px; border-radius: 999px; z-index: 10; }
  .hint { color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<div id="app"></div>
<script src="/js/shared.js"></script>
<script src="/js/common.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
