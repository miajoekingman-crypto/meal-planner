<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>.and — Guest Welcome</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/icon-192.png">
<link rel="stylesheet" href="/css/base.css">
<style>
  .shell { max-width: 560px; padding-top: 6vh; }
  .shell > .logo { height: 80px; margin-bottom: 1.5rem; }
  a.tile { display: block; text-decoration: none; color: inherit; background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 18px 22px; margin-bottom: 12px; transition: border-color .4s; }
  a.tile:hover { border-color: var(--accent); }
  a.tile b { font-weight: 400; font-size: 1.2rem; display: block; }
  a.tile span { color: var(--muted); font-size: .95rem; }
  h1 { font: italic 300 2.4rem var(--serif); margin-bottom: 1.2rem; }
</style>
</head>
<body>
<div class="shell">
  <img class="logo" src="/assets/logo.png" alt=".and">
  <h1>Guest Welcome</h1>
  <a class="tile" href="/guest"><b>/guest</b><span>The iPad in the waiting area</span></a>
  <a class="tile" href="/reception"><b>/reception</b><span>Type the guest’s name and hand over</span></a>
  <a class="tile" href="/orders"><b>/orders</b><span>The assistant’s phone: live orders</span></a>
  <a class="tile" href="/admin"><b>/admin</b><span>Menu, portfolio, news, settings</span></a>
</div>
</body>
</html>
