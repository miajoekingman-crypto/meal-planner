<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>.and — Orders</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content=".and Orders">
<meta name="theme-color" content="#faf8f4">
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest/orders.webmanifest">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="icon" href="/assets/icon-192.png">
<link rel="stylesheet" href="/css/base.css">
<style>
  body { padding-bottom: 40px; }
  .shell { max-width: 640px; padding-left: 14px; padding-right: 14px; }
  .topbar { padding-bottom: 14px; position: sticky; top: 0; background: var(--bg); z-index: 5; margin: 0 -14px; padding-left: 14px; padding-right: 14px; border-bottom: 1px solid var(--line); }
  .topbar .l { display: flex; align-items: center; gap: .8rem; }
  .status { font-size: .8rem; color: var(--muted); }
  .count { background: var(--ink); color: #fff; border-radius: 999px; min-width: 34px; height: 34px; display: inline-grid; place-items: center; padding: 0 10px; font-size: .95rem; }
  .sound { display: flex; align-items: center; justify-content: space-between; gap: 1rem; background: var(--accent-wash); border: 1px solid var(--accent-soft); border-radius: 14px; padding: 12px 14px; margin: 14px 0; font-size: .95rem; }
  .empty { text-align: center; color: var(--muted); padding: 70px 10px; }
  .empty .serif { font: italic 300 2.2rem var(--serif); color: var(--ink); margin-bottom: .3rem; }
  .order { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; margin: 14px 0; overflow: hidden; }
  .order.new { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(217,119,43,.22); } }
  .order .hd { display: flex; justify-content: space-between; align-items: baseline; gap: .8rem; padding: 16px 18px 4px; }
  .order .who { font: 400 1.7rem/1.15 var(--sans); }
  .order .when { font-size: .85rem; color: var(--muted); white-space: nowrap; }
  .order .meet { padding: 0 18px; color: var(--muted); font-size: .92rem; }
  .badge { background: var(--accent); color: #fff; font-size: .68rem; letter-spacing: .14em; padding: 3px 9px; border-radius: 999px; margin-left: .6rem; vertical-align: 4px; }
  .alert { margin: 12px 14px 0; padding: 12px 14px; border-radius: 12px; background: var(--danger-wash); border: 2px solid var(--danger); color: var(--danger); font-weight: 500; }
  .alert.hard { background: var(--danger); color: #fff; font-size: 1.05rem; }
  .alert small { display: block; font-weight: 300; opacity: .95; margin-top: 2px; font-size: .85rem; }
  .lines { padding: 8px 18px 4px; display: grid; gap: 12px; }
  .k { font-size: .68rem; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  .v { font: 400 1.2rem/1.3 var(--sans); }
  .s { color: var(--muted); font-size: .98rem; }
  .contains { margin-top: 3px; display: flex; flex-wrap: wrap; gap: 5px; }
  .pill { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; background: #f1ece3; }
  .pill.hit { background: var(--danger); color: #fff; font-weight: 500; }
  .order .btn { width: calc(100% - 28px); margin: 12px 14px 14px; }
  .flash { position: fixed; inset: 0; background: var(--accent); opacity: 0; pointer-events: none; z-index: 50; }
  .flash.go { animation: flash 1.6s ease-out; }
  @keyframes flash { 0% { opacity: .55; } 100% { opacity: 0; } }
</style>
</head>
<body>
<div class="flash" id="flash"></div>
<div id="app"></div>
<div class="shell" id="main" hidden>
  <div class="topbar">
    <div class="l"><img class="logo" src="/assets/logo.png" alt=".and"><span class="status" id="status"><span class="dot"></span>Connecting…</span></div>
    <span class="count" id="count">0</span>
  </div>
  <div id="sound" class="sound" hidden><span>Tap to turn on the order chime.</span><button class="btn small primary" id="enable">Turn on sound</button></div>
  <div id="list"></div>
</div>
<script src="/js/shared.js"></script>
<script src="/js/common.js"></script>
<script src="/js/orders.js"></script>
</body>
</html>
