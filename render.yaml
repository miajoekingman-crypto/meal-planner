services:
  - type: web
    name: and-guest-welcome
    runtime: node
    plan: free
    rootDir: guest-welcome
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: RECEPTION_PIN
        sync: false
      - key: ADMIN_PIN
        sync: false
      - key: ORDERS_PIN
        sync: false
